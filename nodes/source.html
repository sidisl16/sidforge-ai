<script type="text/x-red" data-help-name="rag-source"><p>Fetches records from an HTTP endpoint and converts each record into <code>msg.rag.document</code>.</p><h3>Usage</h3><p>Use for API-based ingestion. Set <b>Records path</b> for an array response (for example <code>items</code>) and <b>Content path</b> for the text field. Connect to Normalize Document.</p><h3>Output</h3><p>One message per record with a canonical RAG document: ID, content, source, and metadata.</p><h3>Reliability</h3><p>Configure headers, bearer token, timeout, and retry policy. The body field is shown only for POST.</p></script>
