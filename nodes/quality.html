<script type="text/x-red" data-help-name="rag-metadata-validator"><p>Checks that a RAG document has required fields before ingestion.</p><h3>Outputs</h3><p>Output 1 is valid; output 2 contains the same message with missing field names in <code>msg.rag.validation</code>.</p><h3>Usage</h3><p>Place immediately after Source or a document-creation function.</p></script>
<script type="text/x-red" data-help-name="rag-pii-detector"><p>Detects common email, phone, and payment-card-like patterns in text.</p><h3>Outputs</h3><p>Clean messages use output 1; detected PII uses output 2 with findings in <code>msg.rag.pii</code>.</p><h3>Usage</h3><p>Route either output to PII Redactor when ingestion must continue safely.</p></script>
<script type="text/x-red" data-help-name="rag-pii-redactor"><p>Redacts common email and card-like values from a configured text path.</p><h3>Usage</h3><p>Place after PII Detector or use as a proactive ingestion control. The replacement string is configurable.</p></script>
<script type="text/x-red" data-help-name="rag-duplicate-detector"><p>Uses a SHA-256 fingerprint to identify duplicate document content in Node-RED context.</p><h3>Outputs</h3><p>New documents use output 1; duplicates use output 2. Hash details are stored at <code>msg.rag.duplicate</code>.</p></script>
<script type="text/x-red" data-help-name="rag-document-versioner"><p>Adds a content checksum and ingestion timestamp to document metadata.</p><h3>Usage</h3><p>Use after duplicate handling and before chunking to preserve provenance.</p></script>
<script type="text/x-red" data-help-name="rag-chunk-quality-filter"><p>Rejects chunks shorter than the configured character threshold.</p><h3>Outputs</h3><p>Output 1 continues when one or more chunks are accepted; output 2 is used when none qualify.</p></script>
<script type="text/x-red" data-help-name="rag-query-normalizer"><p>Normalizes Unicode and whitespace in a user question.</p><h3>Usage</h3><p>Use at the start of query flows. Configure input and output paths to retain or replace the original question.</p></script>
<script type="text/x-red" data-help-name="rag-query-safety"><p>Detects configurable prompt-injection and unsafe-query patterns.</p><h3>Outputs</h3><p>Safe messages use output 1; a matching pattern routes to output 2 and is reported in <code>msg.rag.safety</code>.</p></script>
<script type="text/x-red" data-help-name="rag-tenant-context"><p>Resolves a tenant identifier from the message or a configured default.</p><h3>Outputs</h3><p>Output 1 has a tenant in <code>msg.rag.tenantId</code>; output 2 has none. Use it before policy and retrieval.</p></script>
<script type="text/x-red" data-help-name="rag-acl-filter"><p>Filters retrieved evidence by the caller’s role list and document ACL metadata.</p><h3>Outputs</h3><p>Authorized evidence uses output 1; no accessible evidence uses output 2.</p></script>
<script type="text/x-red" data-help-name="rag-result-deduplicator"><p>Removes duplicate retrieval candidates by ID or content fingerprint.</p><h3>Usage</h3><p>Use before Evidence Gate to avoid spending context budget on repeated passages.</p></script>
<script type="text/x-red" data-help-name="rag-evidence-packer"><p>Selects evidence that fits the configured context character budget.</p><h3>Usage</h3><p>Place after evidence filtering and before Grounded Prompt. Output is available at <code>msg.rag.retrieval.selected</code>.</p></script>
<script type="text/x-red" data-help-name="rag-claim-extractor"><p>Splits an answer into sentence-like claims for audit or downstream checking.</p><h3>Usage</h3><p>Use after Generate Answer. Claims are stored at <code>msg.rag.answer.claims</code>.</p></script>
<script type="text/x-red" data-help-name="rag-citation-validator"><p>Validates that answer citations refer to selected evidence IDs.</p><h3>Outputs</h3><p>Valid citations use output 1; invalid or missing citations use output 2.</p></script>
<script type="text/x-red" data-help-name="rag-confidence-scorer"><p>Computes a compact confidence score from retrieval confidence, groundedness, and citation presence.</p><h3>Usage</h3><p>Use after citation and grounding processing. The result is written to <code>msg.rag.confidence</code>.</p></script>
<script type="text/x-red" data-help-name="rag-abstention"><p>Creates a safe fallback answer when evidence is weak, inaccessible, or policy blocks generation.</p><h3>Usage</h3><p>Connect the rejected outputs of Evidence Gate, Citation Validator, and Grounding Check here.</p></script>
<script type="text/x-red" data-help-name="rag-secret-redactor"><p>Removes common API-key-like strings from a configured text path.</p><h3>Usage</h3><p>Place immediately before external responses, logs, or observability outputs as a defense-in-depth control.</p></script>
<script type="text/x-red" data-help-name="rag-rate-limiter"><p>Applies an in-memory sliding-window request limit per configured key.</p><h3>Outputs</h3><p>Allowed requests use output 1; limited requests use output 2. Remaining capacity is recorded in <code>msg.rag.rateLimit</code>.</p></script>
<script type="text/x-red" data-help-name="rag-idempotency-guard"><p>Rejects repeated request IDs seen in the local Node-RED context.</p><h3>Outputs</h3><p>First requests use output 1; duplicate keys use output 2. Set the key path to a stable request identifier.</p></script>
<script type="text/x-red" data-help-name="rag-retrieval-evaluator"><p>Calculates recall against expected evidence IDs for a test or evaluation message.</p><h3>Usage</h3><p>Use on evaluation flows; it stores recall and matching IDs at <code>msg.rag.evaluation</code>.</p></script>
<script type="text/x-red" data-help-name="rag-feedback"><p>Captures user rating and correction data from configurable message paths.</p><h3>Usage</h3><p>Connect a feedback endpoint or UI response. The captured event is stored in <code>msg.rag.feedback</code> for forwarding to your own analytics storage.</p></script>
