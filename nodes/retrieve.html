<script type="text/x-red" data-help-name="rag-retrieve"><p>Finds the strongest evidence for a user question.</p><h3>Usage</h3><p>Connect after query safety and tenant handling. Select a Vector Store, choose semantic, keyword, or hybrid search, then connect to ACL Filter and Evidence Gate.</p><h3>Input / output</h3><p>Reads the configured question path (default <code>msg.payload</code>) and writes candidates and retrieval confidence to <code>msg.rag.retrieval</code>.</p><h3>Safety</h3><p>Always set namespace and filters from trusted tenant context; use minimum score to reject weak matches.</p></script>
