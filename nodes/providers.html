<script type="text/x-red" data-template-name="rag-model-provider"><div class="form-row"><label>Name</label><input id="node-config-input-name"></div><fieldset><legend>Local or compatible inference server</legend><div class="form-row"><label>Provider</label><select id="node-config-input-provider"><option value="ollama">Ollama</option><option value="vllm">vLLM (Hugging Face models)</option><option value="tgi">Hugging Face TGI</option><option value="localai">LocalAI</option><option value="llamacpp">llama.cpp server</option><option value="openai-compatible">OpenAI compatible</option><option value="custom">Custom HTTP</option></select></div><div class="form-row provider-endpoint"><label>Chat completions URL</label><input id="node-config-input-url" placeholder="http://127.0.0.1:11434/v1/chat/completions"></div><div class="form-row provider-model"><label>Default model</label><input id="node-config-input-model" placeholder="llama3.2:3b or meta-llama/Llama-3.2-3B-Instruct"></div></fieldset><div class="form-row provider-api-key"><label>API key (optional)</label><input id="node-config-input-apiKey" type="password"></div><div class="form-row"><label>Provider options JSON</label><input id="node-config-input-options" placeholder='{"seed":42}'></div><div class="form-tips">Use Local Model Manager to pull Ollama models. vLLM/TGI/LocalAI run Hugging Face models locally; no paid API is required.</div></script>

<script type="text/x-red" data-help-name="rag-model-provider"><p>Shared connection settings for chat and generation models.</p><h3>Usage</h3><p>Create one provider and select it in Generate Answer. Ollama, vLLM, TGI, LocalAI, and llama.cpp can run open models locally. The local Ollama default endpoint is inferred when URL is blank.</p><h3>Configuration</h3><p>Set the default model and endpoint. API key is only relevant for providers that require it; local runtimes do not.</p></script>
<script type="text/x-red" data-help-name="rag-embedding-provider"><p>Shared connection settings for embedding models.</p><h3>Usage</h3><p>Select this configuration in Embed Chunks. For a free local baseline, use Ollama with <code>nomic-embed-text</code>; vLLM or TGI can serve compatible Hugging Face embedding models.</p><h3>Configuration</h3><p>Leave the Ollama URL blank to use its local default, or enter a compatible embedding endpoint.</p></script>
<script type="text/x-red" data-help-name="rag-vector-store"><p>Shared vector-store connection and namespace defaults.</p><h3>Usage</h3><p>Select the same store in Vector Upsert and Retrieve. Built-in memory is zero-setup and process-local; select an open-source persistent store such as Qdrant, Chroma, Weaviate, Milvus, pgvector, LanceDB, or OpenSearch for production.</p><h3>Configuration</h3><p>Collection and namespace separate tenants or corpora. Memory needs neither endpoint nor API key.</p></script>
<script type="text/x-red" data-help-name="rag-reranker-provider"><p>Shared endpoint for an optional reranking model.</p><h3>Usage</h3><p>Configure a locally hosted BGE reranker or cross-encoder, then select it from Retrieve when your provider integration supports reranking.</p></script>
<script type="text/x-red" data-help-name="rag-cache-provider"><p>Shared cache configuration for flows that use an external cache-aware component.</p><h3>Usage</h3><p>Choose memory for development, or Valkey/Redis for a shared deployment. This configuration is provided for composition with cache-enabled Node-RED flows.</p></script>
<script type="text/x-red" data-help-name="rag-project"><p>Stores reusable project defaults such as tenant, context size, and language.</p><h3>Usage</h3><p>Create one profile per RAG application and use its values as your flow-level conventions. It is a configuration record and does not process messages by itself.</p></script>
<script type="text/x-red" data-help-name="rag-policy-profile"><p>Stores reusable policy targets for grounded RAG responses.</p><h3>Usage</h3><p>Use its values when configuring Grounding Check and flow governance. Keep citation enforcement enabled for evidence-backed answers.</p></script>
