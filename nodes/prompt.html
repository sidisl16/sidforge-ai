<script>RED.nodes.registerType('rag-prompt',{category:'SidForge AI',color:'#70c1b3',defaults:{name:{value:''},query:{value:'payload'},system:{value:'Answer only from supplied evidence. Cite evidence numbers for factual claims.'},template:{value:'{{system}}\n\nEvidence:\n{{context}}\n\nQuestion: {{query}}'},includeSource:{value:'true'},maxContextChars:{value:''}},inputs:1,outputs:1,icon:'font-awesome/fa-quote-right',label:function(){return this.name||'Grounded Prompt';}});</script>
<script type="text/x-red" data-template-name="rag-prompt"><div class="form-row"><label>Name</label><input id="node-input-name"></div><div class="form-row"><label>Question path</label><input id="node-input-query"></div><div class="form-row"><label>System policy</label><textarea id="node-input-system"></textarea></div><div class="form-row"><label>Template</label><textarea id="node-input-template"></textarea></div><div class="form-row"><label>Include sources</label><select id="node-input-includeSource"><option value="true">Yes</option><option value="false">No</option></select></div><div class="form-row"><label>Max context chars</label><input id="node-input-maxContextChars"></div></script>
<script type="text/x-red" data-help-name="rag-prompt"><p>Builds a grounded prompt from the question and selected evidence.</p><h3>Usage</h3><p>Place after Evidence Packer. The template supports <code>{{system}}</code>, <code>{{context}}</code>, and <code>{{query}}</code>. Keep the system policy explicit that answers must use supplied evidence.</p><h3>Output</h3><p>Writes the final prompt to <code>msg.rag.prompt</code>.</p></script>
