<script>
RED.nodes.registerType('rag-local-model',{category:'SidForge AI / Local Runtime',color:'#8bc6a5',defaults:{name:{value:''},runtime:{value:'ollama'},execution:{value:'cli'},command:{value:'ollama'},runtimeUrl:{value:'http://127.0.0.1:11434'},action:{value:'verify'},model:{value:''},modelPath:{value:''},requireAvailable:{value:'true'},insecure:{value:'false'},healthPath:{value:'/health'},timeout:{value:'600000'},retries:{value:'0'},retryDelay:{value:'1000'}},inputs:1,outputs:1,icon:'font-awesome/fa-server',label:function(){return this.name||'Local Model Manager';},oneditprepare:function(){const sync=()=>{const runtime=$('#node-input-runtime').val(),execution=$('#node-input-execution').val(),action=$('#node-input-action').val();$('.row-ollama').toggle(runtime==='ollama');$('.row-cli').toggle(runtime==='ollama'&&execution==='cli');$('.row-api').toggle(runtime!=='ollama'||execution==='api');$('.row-model').toggle(!['list','health'].includes(action));$('.row-verify').toggle(action==='verify');$('.row-pull').toggle(runtime==='ollama'&&action==='pull');$('.row-health').toggle(action==='health'||runtime!=='ollama');};$('#node-input-runtime,#node-input-execution,#node-input-action').on('change',sync);sync();}});
</script>
<script type="text/x-red" data-help-name="rag-local-model"><p>Operates and verifies locally hosted open-model runtimes without leaving Node-RED.</p><h3>Usage</h3><p>Select Ollama to list, verify, or pull models. Pull and native CLI actions use the configured <code>ollama</code> command. For vLLM, TGI, LocalAI, or custom servers, use Health to check the local endpoint.</p><h3>Actions</h3><p><b>Verify</b> checks an installed model; <b>Pull</b> downloads an Ollama model; <b>List</b> enumerates local Ollama models; <b>Health</b> probes a local server.</p><h3>Output</h3><p>Passes the message with operation results in <code>msg.rag.localModel</code>. Connect it to Debug or an operational alert path.</p></script>
<script type="text/x-red" data-template-name="rag-local-model">
  <div class="form-row"><label>Name</label><input id="node-input-name"></div>
  <fieldset><legend>Runtime</legend><div class="form-row"><label>Runtime</label><select id="node-input-runtime"><option value="ollama">Ollama (managed)</option><option value="vllm">vLLM local server</option><option value="tgi">Hugging Face TGI</option><option value="localai">LocalAI</option><option value="custom">Custom local server</option></select></div><div class="form-row row-ollama"><label>Execution</label><select id="node-input-execution"><option value="cli">Native CLI when available</option><option value="api">Local runtime API</option></select></div><div class="form-row row-cli"><label>CLI command</label><input id="node-input-command" placeholder="ollama"></div><div class="form-row row-api"><label>Runtime URL</label><input id="node-input-runtimeUrl"></div><div class="form-row"><label>Action</label><select id="node-input-action"><option value="verify">Verify model installed</option><option value="pull">Pull Ollama model</option><option value="list">List Ollama models</option><option value="health">Check local server health</option></select></div></fieldset>
  <fieldset><legend>Model</legend><div class="form-row row-model"><label>Model name</label><input id="node-input-model" placeholder="llama3.2:3b or BAAI/bge-small-en-v1.5"></div><div class="form-row row-model"><label>Model path override</label><input id="node-input-modelPath" placeholder="payload.model"></div><div class="form-row row-verify"><label>Require available</label><select id="node-input-requireAvailable"><option value="true">Yes</option><option value="false">No</option></select></div><div class="form-row row-pull"><label>Allow insecure pull</label><select id="node-input-insecure"><option value="false">No</option><option value="true">Yes</option></select></div><div class="form-row row-health"><label>Health path</label><input id="node-input-healthPath"></div></fieldset>
  <fieldset><legend>Long-running operation</legend><div class="form-row"><label>Timeout ms</label><input id="node-input-timeout"></div><div class="form-row"><label>Retries</label><input id="node-input-retries"></div><div class="form-row"><label>Base retry delay ms</label><input id="node-input-retryDelay"></div></fieldset>
  <div class="form-tips">Pull is supported only for Ollama. For Hugging Face models, run vLLM, TGI, LocalAI, or llama.cpp locally and configure its endpoint in a Model or Embedding Provider.</div>
</script>
